[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "person_fin_backend"
version = "4.0.0"
description = "Personal Finance Management Backend"
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy==2.0.35",
    "pydantic==2.9.2",
    "python-multipart==0.0.12",
    "aiofiles==24.1.0",
    "croniter>=1.3.0",
    "apscheduler>=3.10.0",
    "structlog>=24.1",
    "httpx==0.28.1",
    "numpy==2.3.5",
    "opencv-contrib-python==4.10.0.84",
    "paddleocr==3.7.0",
    "paddlex==3.7.2",
    "paddlepaddle==3.3.1",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "httpx>=0.25.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
